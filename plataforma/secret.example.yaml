# Exemplo do Secret da plataforma, para subir sem o Terraform:
#   cp plataforma/secret.example.yaml /tmp/plataforma-secret.yaml  # troque as senhas
#   kubectl apply -f /tmp/plataforma-secret.yaml
# Nunca versione o arquivo com senhas reais.
apiVersion: v1
kind: Secret
metadata:
  name: plataforma-secrets
  namespace: oficina
type: Opaque
stringData:
  RABBITMQ_ADMIN_USER: admin
  RABBITMQ_ADMIN_PASSWORD: troque-me
  RABBITMQ_OS_PASSWORD: troque-me
  RABBITMQ_BILLING_PASSWORD: troque-me
  RABBITMQ_EXECUCAO_PASSWORD: troque-me
  MONGO_ROOT_PASSWORD: troque-me
  MONGO_EXECUCAO_PASSWORD: troque-me
