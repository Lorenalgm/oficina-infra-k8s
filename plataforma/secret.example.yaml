# Sem Terraform: copie para fora do repo, troque as senhas e rode kubectl apply -f <arquivo>.
apiVersion: v1
kind: Secret
metadata:
  name: plataforma-secrets
  namespace: oficina
type: Opaque
stringData:
  RABBITMQ_ADMIN_USER: admin
  RABBITMQ_ADMIN_PASSWORD: troque-me
  RABBITMQ_OS_PASSWORD: troque-me
  RABBITMQ_BILLING_PASSWORD: troque-me
  RABBITMQ_EXECUCAO_PASSWORD: troque-me
  MONGO_ROOT_PASSWORD: troque-me
  MONGO_EXECUCAO_PASSWORD: troque-me
