apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: oficina
  labels:
    app.kubernetes.io/name: mongodb
data:
  # Roda só na primeira subida (diretório de dados vazio).
  01-usuario-execucao.js: |
    db.getSiblingDB('execucao').createUser({
      user: 'execucao',
      pwd: process.env.MONGO_EXECUCAO_PASSWORD,
      roles: [{ role: 'readWrite', db: 'execucao' }],
    });
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: oficina
  labels:
    app.kubernetes.io/name: mongodb
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: oficina
  labels:
    app.kubernetes.io/name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8.0
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plataforma-secrets
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_EXECUCAO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plataforma-secrets
                  key: MONGO_EXECUCAO_PASSWORD
          volumeMounts:
            - name: dados
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: init
          configMap:
            name: mongodb-init
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
